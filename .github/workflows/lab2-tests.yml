name: Lab 2 tests

on:
  push:
    paths:
      - "lab2/**"
      - ".github/workflows/lab2-tests.yml"
  pull_request:
    paths:
      - "lab2/**"
      - ".github/workflows/lab2-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab2/sirius_food
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lab2/sirius_food/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate Pact contract
        run: |
          python scripts/generate_order_paid_pact.py
          git diff --exit-code -- tests/contract/pacts
      - name: Run unit and contract tests
        run: pytest -q tests --ignore=tests/integration
      - name: Run Testcontainers integration tests
        run: pytest -v tests/integration
      - name: Validate Compose
        run: docker compose config --quiet

  mutation-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab2/sirius_food
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lab2/sirius_food/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run mutation tests
        run: mutmut run || true
      - name: Reject surviving mutants
        run: python scripts/check_mutation_results.py

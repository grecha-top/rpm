services:
  postgres-shard-0:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rpm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55440:5432"
    volumes:
      - postgres_shard_0_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rpm"]
      interval: 5s
      timeout: 3s
      retries: 20


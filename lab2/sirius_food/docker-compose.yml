services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: sirius
      POSTGRES_PASSWORD: sirius
      POSTGRES_DB: sirius_food
    ports:
      - "1432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirius -d sirius_food"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: sirius
      RABBITMQ_DEFAULT_PASS: sirius
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &app_environment
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RABBITMQ_URL: amqp://sirius:sirius@rabbitmq:5672/
      DELIVERY_GRPC_URL: delivery-grpc:50051
      DEBUG: "true"
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      ENVIRONMENT: docker
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
      OBSERVABILITY_DEMO_ENABLED: ${OBSERVABILITY_DEMO_ENABLED:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      delivery-grpc:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  delivery-grpc:
    build: .
    command: python -m services.delivery.server
    environment: *app_environment
    ports:
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy

  outbox-publisher:
    build: .
    command: python -m app.workers.outbox_publisher
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  kitchen-consumer:
    build: .
    command: python -m app.workers.kitchen_consumer
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  delivery-consumer:
    build: .
    command: python -m services.delivery.worker
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  compensation-consumer:
    build: .
    command: python -m app.workers.order_compensation_consumer
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-worker:
    build: .
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info --queues=default --events
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A app.core.celery_app:celery_app beat --loglevel=info
    environment: *app_environment
    depends_on:
      redis:
        condition: service_healthy

  flower:
    build: .
    command: celery -A app.core.celery_app:celery_app flower --port=5555
    environment: *app_environment
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../sirius_food_frontend
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_started

  locust:
    profiles: ["tools"]
    build: .
    command: >-
      locust -f locustfile.py --host=http://api:8000 --headless
      -u ${LOCUST_USERS:-100} -r ${LOCUST_SPAWN_RATE:-10}
      -t ${LOCUST_DURATION:-30s} --csv=/app/results/lab10-current
      --html=/app/results/lab10-current.html
    environment:
      <<: *app_environment
      LOCUST_ACCESS_TOKEN: ${LOCUST_ACCESS_TOKEN:-}
      LOCUST_ITEM_ID: ${LOCUST_ITEM_ID:-1}
    volumes:
      - ./results:/app/results
      - ./docs:/app/docs
    depends_on:
      api:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sirius_prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: sirius_redis_exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    container_name: sirius_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: sirius_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "4318:4318"

volumes:
  pg_data:
  rabbit_data:
  grafana_data:
